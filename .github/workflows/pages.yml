name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/typescript/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: games/go/go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Make sure clang can emit wasm
        run: |
          if ! command -v clang >/dev/null || ! command -v wasm-ld >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang lld
          fi
          clang --version
          wasm-ld --version

      - name: Stage the hub page
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # Pages would otherwise run Jekyll over the output.
          touch _site/.nojekyll

      - name: Build TypeScript
        run: bash games/typescript/build.sh "$PWD/_site/typescript"

      - name: Test the TypeScript engine
        working-directory: games/typescript
        run: npm test

      - name: Build Rust
        run: bash games/rust/build.sh "$PWD/_site/rust"

      - name: Build Go
        run: bash games/go/build.sh "$PWD/_site/go"

      - name: Build C
        run: bash games/c/build.sh "$PWD/_site/c"

      - name: Build Python
        run: bash games/python/build.sh "$PWD/_site/python"

      - name: Build Elm
        run: bash games/elm/build.sh "$PWD/_site/elm"

      - name: Check every game landed
        run: |
          for game in typescript rust go c python elm; do
            test -s "_site/$game/index.html" || { echo "missing _site/$game/index.html"; exit 1; }
          done
          find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
