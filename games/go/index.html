<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="color-scheme" content="dark" />
    <title>Snake &middot; Go</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #1a1a2e;
        color: #e8e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      a {
        color: #a0a0c0;
        text-decoration: none;
      }
      a:hover {
        color: #00cec9;
      }
      kbd {
        border: 1px solid #2d3436;
        border-radius: 4px;
        padding: 1px 5px;
        color: #a0a0c0;
      }
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
      }
      .screen[hidden] {
        display: none;
      }

      /* ── Menu ───────────────────────────────────────────────── */
      #menu h1 {
        font-size: clamp(34px, 9vw, 68px);
        letter-spacing: 0.1em;
        color: #00cec9;
        font-weight: 700;
        text-align: center;
      }
      #menu h1 .lang {
        display: block;
        font-size: 0.3em;
        letter-spacing: 0.2em;
        color: #00b894;
      }
      #menu .sub {
        font-size: 14px;
        color: #636e72;
        margin-top: -8px;
      }
      .cards {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 18px 0;
      }
      .card {
        width: 260px;
        height: 160px;
        border-radius: 14px;
        border: 2px solid;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        background: transparent;
        font: inherit;
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.18s;
        position: relative;
        overflow: hidden;
      }
      .card::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        top: 6px;
        height: 1px;
        background: currentColor;
        opacity: 0.2;
      }
      .card .label {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .card .hint {
        font-size: 14px;
        color: #636e72;
      }
      .card.normal {
        border-color: rgba(0, 206, 201, 0.55);
        color: #00cec9;
        background: rgba(0, 206, 201, 0.08);
      }
      .card.demo {
        border-color: rgba(108, 92, 231, 0.55);
        color: #6c5ce7;
        background: rgba(108, 92, 231, 0.08);
      }
      .card.normal:hover,
      .card.normal:focus-visible {
        background: rgba(0, 206, 201, 0.22);
        border-color: #00cec9;
        transform: scale(1.05);
        outline: none;
      }
      .card.demo:hover,
      .card.demo:focus-visible {
        background: rgba(108, 92, 231, 0.22);
        border-color: #6c5ce7;
        transform: scale(1.05);
        outline: none;
      }
      .card:hover .label,
      .card:focus-visible .label {
        color: #fff;
      }
      .card:hover .hint,
      .card:focus-visible .hint {
        color: #b2bec3;
      }
      .card:active {
        transform: scale(0.96);
      }
      #menu .best {
        font-size: 16px;
        color: #636e72;
      }
      #menu .ai-stats {
        font-size: 14px;
        color: #6c5ce7;
      }
      #menu .foot {
        position: absolute;
        bottom: max(10px, env(safe-area-inset-bottom));
        font-size: 12px;
        color: #6b6b8a;
        display: flex;
        gap: 14px;
      }

      /* ── Game ───────────────────────────────────────────────── */
      #game {
        justify-content: flex-start;
        gap: 8px;
      }
      .hud {
        width: 100%;
        max-width: 1100px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        min-height: 32px;
      }
      .icon-btn {
        background: none;
        border: none;
        color: #00cec9;
        font: inherit;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
      }
      .icon-btn:hover {
        color: #fff;
      }
      .pill {
        background: #2d3436;
        border-radius: 4px;
        padding: 4px 10px;
        display: inline-block;
        transform-origin: center;
      }
      #score {
        color: #ffeaa7;
      }
      #best {
        color: #e0e0e0;
        margin-left: auto;
      }
      #vision-btn {
        background: none;
        border: none;
        font: inherit;
        font-size: 14px;
        color: #b2bec3;
        cursor: pointer;
        padding: 4px 6px;
      }
      #vision-btn[hidden] {
        display: none;
      }
      #vision-btn.on {
        color: #00cec9;
      }
      .pop {
        animation: pop 0.24s ease-out;
      }
      @keyframes pop {
        0% { transform: scale(1); }
        45% { transform: scale(1.18); }
        100% { transform: scale(1); }
      }
      .stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-height: 0;
        width: 100%;
        touch-action: none;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        border: 2px solid #2d3436;
        border-radius: 4px;
      }
      .shake {
        animation: shake 0.2s linear;
      }
      @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-3px, 2px); }
        50% { transform: translate(3px, -2px); }
        75% { transform: translate(-2px, -2px); }
      }
      #gameover {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 24px;
        line-height: 1.35;
        color: #ff6b6b;
        white-space: pre;
        pointer-events: none;
        animation: reveal 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #gameover[hidden] {
        display: none;
      }
      @keyframes reveal {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }
      #tier-badge {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        font-size: 14px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(45, 52, 54, 0.9);
        border: 1px solid #2d3436;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #tier-badge.show {
        opacity: 1;
      }
      footer {
        width: 100%;
        max-width: 1100px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: #6b6b8a;
        flex-wrap: wrap;
      }

      /* ── Touch D-pad ────────────────────────────────────────── */
      #dpad {
        position: fixed;
        right: 24px;
        bottom: 24px;
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        z-index: 5;
      }
      #dpad[hidden] {
        display: none;
      }
      #dpad button {
        background: rgba(45, 52, 54, 0.55);
        border: 1px solid #2d3436;
        border-radius: 8px;
        color: #00cec9;
        font: inherit;
        font-size: 22px;
        cursor: pointer;
      }
      #dpad button:active {
        background: rgba(0, 206, 201, 0.3);
      }
      .card.wrap {
        border-color: rgba(253, 203, 110, 0.55);
        color: #fdcb6e;
        background: rgba(253, 203, 110, 0.08);
      }
      .card.wrap:hover,
      .card.wrap:focus-visible {
        background: rgba(253, 203, 110, 0.22);
        border-color: #fdcb6e;
        transform: scale(1.05);
        outline: none;
      }
      .card.wrap.on {
        background: rgba(253, 203, 110, 0.28);
        border-color: #ffeaa7;
        color: #ffeaa7;
      }
      .wrap-pill {
        color: #fdcb6e;
        border: 1px solid rgba(253, 203, 110, 0.55);
      }
      @media (prefers-reduced-motion: reduce) {
        .card, .pop, .shake, #gameover { animation: none; transition: none; }
      }
  </head>
  <body>
    <div class="screen" id="menu">
      <h1>SNAKE<span class="lang">// GO</span></h1>
      <p class="sub">Choose your mode</p>
      <div class="cards">
        <button class="card normal" id="play-normal">
          <span class="label">NORMAL</span>
          <span class="hint">Tap or use arrow keys</span>
        </button>
        <button class="card demo" id="play-demo">
          <span class="label">DEMO</span>
          <span class="hint">Watch the AI</span>
        </button>
        <button class="card wrap" id="play-wrap" aria-pressed="false">
          <span class="label">WRAP</span>
          <span class="hint">Torus walls (toggle)</span>
        </button>
      </div>
      <p class="best" id="menu-best">Best: &mdash;</p>
      <p class="ai-stats" id="menu-ai">Loading the Go runtime&hellip;</p>
      <div class="foot">
        <span><kbd>N</kbd> normal &middot; <kbd>D</kbd> demo &middot; <kbd>T</kbd> wrap</span>
        <a href="../">&larr; all snakes</a>
      </div>
    </div>

    <div class="screen" id="game" hidden>
      <div class="hud">
        <button class="icon-btn" id="menu-btn" title="Menu (M)">&#9776;</button>
        <span class="pill" id="score">Score: 0</span>
        <span class="pill" id="best">Best: &mdash;</span>
        <span class="pill wrap-pill" id="wrap-pill" hidden>WRAP</span>
        <button id="vision-btn" hidden>AI Vision: off</button>
      </div>
        <canvas id="board"></canvas>
        <div id="gameover" hidden></div>
        <div id="tier-badge"></div>
      </div>

      <footer>
        <span id="controls-hint"></span>
        <a href="../">&larr; all snakes</a>
      </footer>

      <div id="dpad" hidden>
        <button class="up" data-dir="0">&uarr;</button>
        <button class="left" data-dir="3">&larr;</button>
        <button class="right" data-dir="1">&rarr;</button>
        <button class="down" data-dir="2">&darr;</button>
      </div>
    </div>

    <!-- Shipped with the Go toolchain; copied out of GOROOT at build time. -->
    <script src="wasm_exec.js"></script>
    <script>
      // Everything past this point happens in Go: the menu, the rules, the demo
      // AI, the HUD and the drawing all run through syscall/js.
      const go = new Go();
      fetch("snake.wasm")
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.arrayBuffer();
        })
        .then((bytes) => WebAssembly.instantiate(bytes, go.importObject))
        .then(({ instance }) => go.run(instance))
        .catch((err) => {
          document.getElementById("menu-ai").textContent = `Failed to load: ${err}`;
        });
    </script>
  </body>
</html>
