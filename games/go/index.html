<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="color-scheme" content="dark" />
    <title>Snake &middot; Go</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        background: #1a1a2e;
        color: #e8e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: #a0a0c0;
        text-decoration: none;
      }
      a:hover {
        color: #00cec9;
      }
      header {
        width: min(92vw, 576px);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        letter-spacing: 0.08em;
      }
      h1 .lang {
        color: #00cec9;
      }
      .hud {
        display: flex;
        gap: 18px;
        font-size: 13px;
        color: #a0a0c0;
      }
      .hud b {
        color: #00cec9;
        font-variant-numeric: tabular-nums;
      }
      .stage {
        position: relative;
        width: min(92vw, 576px);
        aspect-ratio: 1;
        border: 1px solid #2d3436;
        border-radius: 12px;
        overflow: hidden;
        background: #16213e;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        padding: 20px;
        background: rgba(26, 26, 46, 0.86);
        backdrop-filter: blur(2px);
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h2 {
        font-size: 22px;
        letter-spacing: 0.1em;
        color: #00cec9;
      }
      .overlay p {
        font-size: 13px;
        color: #a0a0c0;
        line-height: 1.6;
      }
      footer {
        width: min(92vw, 576px);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: #6b6b8a;
        flex-wrap: wrap;
      }
      kbd {
        border: 1px solid #2d3436;
        border-radius: 4px;
        padding: 1px 5px;
        color: #a0a0c0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SNAKE <span class="lang">// GO</span></h1>
      <div class="hud">
        <span>SCORE <b id="score">0</b></span>
        <span>BEST <b id="best">0</b></span>
      </div>
    </header>

    <div class="stage">
      <canvas id="board" width="576" height="576"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">GO SNAKE</h2>
        <p id="overlay-text">Loading the Go runtime&hellip;</p>
      </div>
    </div>

    <footer>
      <span><kbd>&larr;&uarr;&darr;&rarr;</kbd> / <kbd>WASD</kbd> move &middot; <kbd>P</kbd> pause &middot; swipe on mobile</span>
      <a href="../">&larr; all snakes</a>
    </footer>

    <!-- Shipped with the Go toolchain; copied out of GOROOT at build time. -->
    <script src="wasm_exec.js"></script>
    <script>
      // Everything past this point happens in Go: input, ticking and drawing
      // all run through syscall/js against the canvas above.
      const go = new Go();
      fetch("snake.wasm")
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.arrayBuffer();
        })
        .then((bytes) => WebAssembly.instantiate(bytes, go.importObject))
        .then(({ instance }) => go.run(instance))
        .catch((err) => {
          document.getElementById("overlay-title").textContent = "LOAD FAILED";
          document.getElementById("overlay-text").textContent = String(err);
        });
    </script>
  </body>
</html>
