<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="color-scheme" content="dark" />
    <title>Snake &middot; C</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        background: #1a1a2e;
        color: #e8e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: #a0a0c0;
        text-decoration: none;
      }
      a:hover {
        color: #00cec9;
      }
      header {
        width: min(92vw, 576px);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        letter-spacing: 0.08em;
      }
      h1 .lang {
        color: #74b9ff;
      }
      .hud {
        display: flex;
        gap: 18px;
        font-size: 13px;
        color: #a0a0c0;
      }
      .hud b {
        color: #00cec9;
        font-variant-numeric: tabular-nums;
      }
      .stage {
        position: relative;
        width: min(92vw, 576px);
        aspect-ratio: 1;
        border: 1px solid #2d3436;
        border-radius: 12px;
        overflow: hidden;
        background: #16213e;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        padding: 20px;
        background: rgba(26, 26, 46, 0.86);
        backdrop-filter: blur(2px);
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay h2 {
        font-size: 22px;
        letter-spacing: 0.1em;
        color: #00cec9;
      }
      .overlay p {
        font-size: 13px;
        color: #a0a0c0;
        line-height: 1.6;
      }
      footer {
        width: min(92vw, 576px);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: #6b6b8a;
        flex-wrap: wrap;
      }
      kbd {
        border: 1px solid #2d3436;
        border-radius: 4px;
        padding: 1px 5px;
        color: #a0a0c0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SNAKE <span class="lang">// C</span></h1>
      <div class="hud">
        <span>SCORE <b id="score">0</b></span>
        <span>BEST <b id="best">0</b></span>
      </div>
    </header>

    <div class="stage">
      <canvas id="board" width="576" height="576"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">C SNAKE</h2>
        <p id="overlay-text">LinkingCompiling&hellip;hellip;</p>
      </div>
    </div>

    <footer>
      <span><kbd>&larr;&uarr;&darr;&rarr;</kbd> / <kbd>WASD</kbd> move &middot; <kbd>P</kbd> pause &middot; swipe on mobile</span>
      <a href="../">&larr; all snakes</a>
    </footer>

    <script type="module">
      const CELL = 24;
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayText = document.getElementById("overlay-text");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");

      const BEST_KEY = "snake-c-best";
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      let wasm, W, H, running = false, paused = false;
      let interval = 120, acc = 0, last = 0;

      function grid() {
        return new Uint8Array(wasm.memory.buffer, wasm.grid_ptr(), W * H);
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
      }

      function draw() {
        ctx.fillStyle = "#1a1a2e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#16213e";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 1; i < W; i++) {
          ctx.moveTo(i * CELL + 0.5, 0);
          ctx.lineTo(i * CELL + 0.5, canvas.height);
        }
        for (let j = 1; j < H; j++) {
          ctx.moveTo(0, j * CELL + 0.5);
          ctx.lineTo(canvas.width, j * CELL + 0.5);
        }
        ctx.stroke();

        const cells = grid();
        for (let i = 0; i < cells.length; i++) {
          const tag = cells[i];
          if (tag === 0) continue;
          const x = (i % W) * CELL;
          const y = Math.floor(i / W) * CELL;
          if (tag === 3) {
            ctx.fillStyle = "#ff7675";
            ctx.beginPath();
            ctx.arc(x + CELL / 2, y + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
            ctx.fill();
          } else if (tag === 1) {
            ctx.fillStyle = "#6c5ce7";
            roundRect(x + 2, y + 2, CELL - 4, CELL - 4, 5);
          } else {
            ctx.fillStyle = "#00cec9";
            roundRect(x + 1, y + 1, CELL - 2, CELL - 2, 6);
            ctx.fillStyle = "#0a0a1e";
            const r = CELL * 0.09;
            ctx.beginPath();
            ctx.arc(x + CELL * 0.35, y + CELL * 0.38, r, 0, Math.PI * 2);
            ctx.arc(x + CELL * 0.65, y + CELL * 0.38, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function showOverlay(title, text) {
        overlayTitle.textContent = title;
        overlayText.innerHTML = text;
        overlay.hidden = false;
      }

      function tick(now) {
        requestAnimationFrame(tick);
        if (!running || paused) {
          last = now;
          return;
        }
        acc += now - last;
        last = now;
        if (acc < interval) return;
        acc = 0;

        const result = wasm.step();
        const score = wasm.score();
        scoreEl.textContent = score;

        if (result & 1) interval = Math.max(65, interval - 2);
        if (result & 2 || result & 4) {
          running = false;
          if (score > best) {
            best = score;
            localStorage.setItem(BEST_KEY, String(best));
            bestEl.textContent = best;
          }
          showOverlay(
            result & 4 ? "PERFECT GAME" : "GAME OVER",
            `Score <b>${score}</b> &middot; length ${wasm.length()}<br />Press <kbd>SPACE</kbd> or tap to play again`,
          );
        }
        draw();
      }

      function newGame() {
        interval = 120;
        acc = 0;
        paused = false;
        wasm.init((Math.random() * 0xffffffff) >>> 0);
        scoreEl.textContent = "0";
        overlay.hidden = true;
        running = true;
        draw();
      }

      const KEYS = {
        ArrowUp: 0, KeyW: 0,
        ArrowRight: 1, KeyD: 1,
        ArrowDown: 2, KeyS: 2,
        ArrowLeft: 3, KeyA: 3,
      };

      addEventListener("keydown", (e) => {
        if (!wasm) return;
        if (e.code in KEYS) {
          e.preventDefault();
          if (running && !paused) wasm.set_dir(KEYS[e.code]);
          else if (!running && !paused) newGame();
          return;
        }
        if (e.code === "Space" || e.code === "Enter") {
          e.preventDefault();
          if (!running) newGame();
        } else if (e.code === "KeyP" && running) {
          paused = !paused;
          if (paused) showOverlay("PAUSED", "Press <kbd>P</kbd> to resume");
          else overlay.hidden = true;
        }
      });

      let touch = null;
      const stage = document.querySelector(".stage");
      stage.addEventListener("touchstart", (e) => {
        touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, { passive: true });
      stage.addEventListener("touchend", (e) => {
        if (!wasm || !touch) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touch.x;
        const dy = t.clientY - touch.y;
        touch = null;
        if (Math.hypot(dx, dy) < 24) {
          if (!running) newGame();
          return;
        }
        if (!running) return newGame();
        if (Math.abs(dx) > Math.abs(dy)) wasm.set_dir(dx > 0 ? 1 : 3);
        else wasm.set_dir(dy > 0 ? 2 : 0);
      }, { passive: true });

      (async () => {
        try {
          const bytes = await fetch("snake.wasm").then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.arrayBuffer();
          });
          const { instance } = await WebAssembly.instantiate(bytes, {});
          wasm = instance.exports;
          W = wasm.width();
          H = wasm.height();
          canvas.width = W * CELL;
          canvas.height = H * CELL;
          wasm.init((Math.random() * 0xffffffff) >>> 0);
          draw();
          showOverlay("C SNAKE", "Press <kbd>SPACE</kbd> or tap to start");
          requestAnimationFrame(tick);
        } catch (err) {
          showOverlay("LOAD FAILED", String(err));
        }
      })();

      stage.addEventListener("click", () => {
        if (!running && wasm && !paused) newGame();
      });
    </script>
  </body>
</html>
